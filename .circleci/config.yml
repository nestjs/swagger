version: 2.1

executors:
  node:
    working_directory: ~/nest
    docker:
      - image: cimg/node:26.13.0

commands:
  install-deps:
    steps:
      - restore_cache:
          key: dependency-cache-{{ checksum "package.json" }}
      - run:
          name: Install dependencies
          command: npm install --ignore-scripts --legacy-peer-deps
  build-packages:
    steps:
      - run:
          name: Build
          command: npm run build

jobs:
  forbidden_paths:
    executor: node
    steps:
      - checkout
      - run:
          name: Reject editor auto-run config and disguised payloads
          command: |
            # Editor configs can run code when a contributor opens the folder
            # (e.g. VS Code tasks with runOn: folderOpen), so none may be committed.
            offending=$(git ls-files | grep -E '(^|/)\.(vscode|devcontainer|idea|fleet|zed)/|\.llf$' || true)
            autorun=$(git grep -lE '"runOn"[[:space:]]*:[[:space:]]*"folderOpen"' || true)
            if [ -n "$offending$autorun" ]; then
              echo "Forbidden files found:"
              printf '%s\n' $offending $autorun | sort -u
              exit 1
            fi

  build:
    executor: node
    steps:
      - checkout
      - install-deps
      - save_cache:
          key: dependency-cache-{{ checksum "package.json" }}
          paths:
            - ./node_modules
      - build-packages

  unit_tests:
    executor: node
    steps:
      - checkout
      - install-deps
      - build-packages
      - run:
          name: Test
          command: npm run test

  e2e_tests:
    executor: node
    steps:
      - checkout
      - install-deps
      - build-packages
      - run:
          name: E2E test
          command: npm run test:e2e

workflows:
  build-and-test:
    jobs:
      - forbidden_paths
      - build:
          requires:
            - forbidden_paths
      - unit_tests:
          requires:
            - build
      - e2e_tests:
          requires:
            - build
