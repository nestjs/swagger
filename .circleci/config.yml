version: 2

aliases:
  - &restore-cache
    restore_cache:
      key: dependency-cache-{{ checksum "package.json" }}
  - &install-deps
    run:
      name: Install dependencies
      command: npm install --ignore-scripts --legacy-peer-deps
  - &build-packages
    run:
      name: Build
      command: npm run build
  - &run-unit-tests
    run:
      name: Test
      command: npm run test
  - &run-e2e-tests
    run:
      name: E2E test
      command: npm run test:e2e

jobs:
  forbidden_paths:
    working_directory: ~/nest
    docker:
      - image: cimg/node:24.21.0
    steps:
      - checkout
      - run:
          name: Reject editor auto-run config and disguised payloads
          command: |
            # Editor configs can run code when a contributor opens the folder
            # (e.g. VS Code tasks with runOn: folderOpen), so none may be committed.
            offending=$(git ls-files | grep -E '(^|/)\.(vscode|devcontainer|idea|fleet|zed)/|\.llf$' || true)
            autorun=$(git grep -lE '"runOn"[[:space:]]*:[[:space:]]*"folderOpen"' || true)
            if [ -n "$offending$autorun" ]; then
              echo "Forbidden files found:"
              printf '%s\n' $offending $autorun | sort -u
              exit 1
            fi

  build:
    working_directory: ~/nest
    docker:
      - image: cimg/node:24.21.0
    steps:
      - checkout
      - restore_cache:
          key: dependency-cache-{{ checksum "package.json" }}
      - run:
          name: Install dependencies
          command: npm install --ignore-scripts --legacy-peer-deps
      - save_cache:
          key: dependency-cache-{{ checksum "package.json" }}
          paths:
            - ./node_modules
      - run:
          name: Build
          command: npm run build

  unit_tests:
    working_directory: ~/nest
    docker:
      - image: cimg/node:24.21.0
    steps:
      - checkout
      - *restore-cache
      - *install-deps
      - *build-packages
      - *run-unit-tests

  e2e_tests:
    working_directory: ~/nest
    docker:
      - image: cimg/node:24.21.0
    steps:
      - checkout
      - *restore-cache
      - *install-deps
      - *build-packages
      - *run-e2e-tests

workflows:
  version: 2
  build-and-test:
    jobs:
      - forbidden_paths
      - build:
          requires:
            - forbidden_paths
      - unit_tests:
          requires:
            - build
      - e2e_tests:
          requires:
            - build
